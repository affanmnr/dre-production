      ${F.colors.map((c, i) => `<tr><td><input type="text" value="${esc(c.pattern)}" data-cf="pattern" data-ci="${i}" placeholder="mis. Merah Kartu"></td>
        ${multi ? `<td><input type="text" value="${esc(c.product)}" data-cf="product" data-ci="${i}" placeholder="${esc(F.name || 'sama dengan nama produk')}"></td>` : ''}
        <td><input type="number" min="0" value="${c.papan}" data-cf="papan" data-ch="fColorSplit" data-ci="${i}"></td>
        <td><input type="number" min="1" max="30" value="${c.nb}" data-cf="nb" data-ch="fColorSplit" data-ci="${i}"></td>
        ${multi ? `<td><button class="icon-btn" data-act="fDelColor" data-ci="${i}" title="Hapus warna ini">✕</button></td>` : ''}</tr>`).join('')}
      </tbody></table>
      ${multi ? `<div class="small muted" style="margin-top:4px">Total ${F.colors.reduce((a, c) => a + c.papan, 0)} papan · ${F.batches.length} batch. Jenis produk boleh dikosongkan kalau sama dengan nama produk.</div>` : ''}</div>
    <div class="full"><div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"><label class="f grow" style="margin:0">Batch</label>
      <button class="btn sm" data-act="fSplit">Bagi rata papan</button></div>
      <table class="btable"><thead><tr><th></th><th>Warna</th><th style="width:110px">Papan needed</th></tr></thead><tbody>
      ${F.batches.map((b, i) => { const c = F.colors.find(x => x.id === b.cid) || {}; return `<tr><td class="small muted" style="white-space:nowrap">Batch ${i + 1}</td><td class="small">${esc(c.pattern || '–')}${multi && c.product ? ' · ' + esc(c.product) : ''}</td><td><input type="number" min="0" value="${needOf(F, b)}" data-bf="panelNeeded" data-ch="fBatchPanel" data-i="${i}"></td></tr>`; }).join('')}
      </tbody></table></div>
    <div class="full"><label class="f">Catatan</label><textarea rows="2" data-f="notes">${esc(F.notes)}</textarea></div></div>`;
  modal(F._new ? 'Proyek baru' : 'Edit proyek', body, `<button class="btn ghost" data-act="closeModal">Batal</button><button class="btn pri" data-act="saveProj">Simpan</button>`, true);
}

/* ============ ACTIONS ============ */
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 1900); }
const commit = (msg) => { save(); render(); if (msg) toast(msg); };

function assignTask(key, empId, date){
  delete S.doneManual[key];
  const pl = S.plots.find(x => x.type === 'task' && x.key === key);
  if (pl) Object.assign(pl, {emp: empId, date, done: false});
  else S.plots.push({id: uid(), type: 'task', key, emp: empId, date, done: false});
  const t = taskByKey(key);
  commit(`${t ? t.step : 'Tugas'} → ${emp(empId)?.name} (${fmtDate(date)})`);
}

const ACT = {
  page: d => { if (!canSee(d.page)) return; UI.page = d.page; lsSet('dre-page', d.page); render(); window.scrollTo(0, 0); },
  setf: d => { UI[d.k] = d.v; render(); },
  seg: d => { const same = UI.fOwner === d.o && UI.fCat === d.c; UI.fOwner = same ? 'all' : d.o; UI.fCat = same ? 'all' : d.c; render(); },
  openProj: d => { UI.page = 'projects'; UI.collapsed[d.id] = false; UI.openProj = d.id; render(); setTimeout(() => { const el = document.querySelector(`[data-act="toggleProj"][data-id="${d.id}"]`); el && el.scrollIntoView({behavior:'smooth', block:'start'}); }, 30); },
  queueGroup: d => { UI.queueOpen.has(d.id) ? UI.queueOpen.delete(d.id) : UI.queueOpen.add(d.id); render(); },
  queueAll: () => { const all = UI._qg.every(id => UI.queueOpen.has(id)); UI._qg.forEach(id => all ? UI.queueOpen.delete(id) : UI.queueOpen.add(id)); render(); },
  panelGroup: d => { UI.panelOpen.has(d.id) ? UI.panelOpen.delete(d.id) : UI.panelOpen.add(d.id); render(); },
  panelAll: () => { const all = UI._pg.every(id => UI.panelOpen.has(id)); UI._pg.forEach(id => all ? UI.panelOpen.delete(id) : UI.panelOpen.add(id)); render(); },
  selMode: () => { UI.selMode = !UI.selMode; UI.sel.clear(); UI.openProj = null; render(); },
  selToggle: d => { UI.sel.has(d.id) ? UI.sel.delete(d.id) : UI.sel.add(d.id); render(); },
  selAll: () => { const all = UI._list.every(id => UI.sel.has(id)); UI._list.forEach(id => all ? UI.sel.delete(id) : UI.sel.add(id)); render(); },
  resetFilters: () => { UI.fOwner = 'all'; UI.fCat = 'all'; UI.pStatus = 'all'; UI.pq = ''; render(); },
  bulk: d => {
    const ps = S.projects.filter(p => UI.sel.has(p.id) && UI._list.includes(p.id)), n = ps.length;
    if (!n) return;
    const done = msg => { UI.sel.clear(); UI.selMode = false; commit(msg); };
    if (d.op === 'start') { ps.forEach(p => { p.live = true; if (!p.batches.some(b => batchOn(p, b)) && p.batches[0]) p.batches[0].live = true; }); done(`${n} proyek mulai produksi`); }
    else if (d.op === 'stop') { ps.forEach(p => p.live = false); done(`Produksi ${n} proyek dihentikan`); }
    else if (d.op === 'archive') { const a = !UI.showArchived; ps.forEach(p => p.archived = a); done(a ? `${n} proyek diarsipkan` : `${n} proyek aktif lagi`); }
    else if (d.op === 'delete') {
      const go = () => { ps.forEach(p => removeProject(p.id)); done(`${n} proyek dihapus`); }, msg = `Hapus ${n} proyek? Plotting & panel terkait ikut terhapus.`;
      if (typeof ask === 'function') ask(msg, `Hapus ${n} proyek`, go); else if (confirm(msg)) go();
    }
  },
  toggleProj: d => { if (UI.selMode) return ACT.selToggle(d); if (UI.projView === 'grid') UI.openProj = UI.openProj === d.id ? null : d.id; else UI.collapsed[d.id] = !UI.collapsed[d.id]; render(); },
  openTile: d => { if (UI.selMode) return ACT.selToggle(d); UI.openProj = d.id; render(); setTimeout(() => document.querySelector(`[data-act="toggleProj"][data-id="${d.id}"]`)?.scrollIntoView({behavior:'smooth', block:'start'}), 30); },
  projView: d => { UI.projView = d.v; lsSet('dre-projview', d.v); render(); },
  startProj: d => { const p = S.projects.find(x => x.id === d.id); p.live = true; if (!p.batches.some(b => batchOn(p, b)) && p.batches[0]) p.batches[0].live = true; closeModal(); commit(`${projName(p)} mulai produksi: ${p.batches.filter(b => batchOn(p, b)).length} batch masuk Plotting & Panel`); },
  batchStart: d => { const p = S.projects.find(x => x.id === d.pid), bi = p.batches.findIndex(x => x.id === d.bid); p.batches[bi].live = true; closeModal(); commit(`${batchLabel(p, bi)} ${projName(p)} masuk Plotting & Panel`); },
  batchStop: d => { const p = S.projects.find(x => x.id === d.pid), bi = p.batches.findIndex(x => x.id === d.bid); p.batches[bi].live = false; commit(`${batchLabel(p, bi)} dihentikan: keluar dari antrian Plotting & Panel`); },
  batchStartAll: d => { const p = S.projects.find(x => x.id === d.pid); p.batches.forEach(b => b.live = true); commit(`Semua batch ${projName(p)} masuk Plotting & Panel`); },
  pauseProj: d => { const p = S.projects.find(x => x.id === d.id); p.live = false; commit('Produksi dihentikan: proyek tidak muncul lagi di antrian Plotting & Panel'); },
  toggleArchived: () => { UI.showArchived = !UI.showArchived; render(); },
  newProj: () => openProjectForm(),
  editProj: d => openProjectForm(d.id),
  archiveProj: d => { const p = S.projects.find(x => x.id === d.id); p.archived = !p.archived; commit(p.archived ? 'Proyek diarsipkan' : 'Proyek aktif lagi'); },
  delProj: d => {
    const p = S.projects.find(x => x.id === d.id);
    ask(`Hapus proyek "${projName(p)}"? Plotting & panel terkait ikut terhapus.`, 'Hapus proyek', () => {
      S.projects = S.projects.filter(x => x.id !== d.id);
      S.plots = S.plots.filter(x => !(x.type === 'task' && x.key.startsWith(d.id + '|')));
      S.panels = S.panels.filter(x => x.pid !== d.id);
      Object.keys(S.doneManual).forEach(k => k.startsWith(d.id + '|') && delete S.doneManual[k]);
      commit('Proyek dihapus');
    });
  },
  cell: d => openTaskModal(d.key),
  pickTask: d => openTaskModal(d.key),
  assignEmp: d => { const date = document.getElementById('asgDate')?.value || UI.date; closeModal(); assignTask(d.key, d.emp, date); },
  markDone: d => { const pl = S.plots.find(x => x.type === 'task' && x.key === d.key); if (pl) pl.done = true; else S.doneManual[d.key] = true; closeModal(); commit('Ditandai selesai ✓'); },
  resetTask: d => { S.plots = S.plots.filter(x => !(x.type === 'task' && x.key === d.key)); delete S.doneManual[d.key]; closeModal(); commit('Kembali ke antrian'); },
  pAdj: d => { const p = S.projects.find(x => x.id === d.pid); p[d.k] = Math.max(0, pcsStats(p)[d.k] + (+d.d)); commit(); },
  addBatch: d => {
    const p = S.projects.find(x => x.id === d.id), last = p.batches[p.batches.length - 1] || {}, sf = shortfall(p);
    const cols = colorsOf(JSON.parse(JSON.stringify(p))), lastPat = last.pattern || p.pattern || '';
    modal(`Tambah batch · ${esc(projName(p))}`, `<div class="fgrid">
      ${cols.length > 1 ? `<div><label class="f">Warna papan</label><select id="nbColor">${cols.map((c, i) => `<option value="${i}" ${c.pattern === lastPat && c.product === (last.product || '') ? 'selected' : ''}>${esc(c.pattern)}${c.product ? ' · ' + esc(c.product) : ''}</option>`).join('')}</select></div>` : ''}
      <div><label class="f">Papan needed</label><input type="number" id="nbQty" min="1" value="${needOf(p, last) || 1}"></div></div>
      ${p.owner === 'internal' ? `<label style="display:flex;gap:8px;align-items:center;margin-top:12px;font-size:13px;cursor:pointer"><input type="checkbox" id="nbLive" ${isLive(p) ? 'checked' : ''} style="accent-color:var(--green);width:16px;height:16px">Langsung mulai batch ini (masuk Plotting & Panel)</label>` : ''}${sf ? `<p class="small muted">Pcs jadi masih kurang ${sf} pcs.</p>` : ''}`,
      `<button class="btn ghost" data-act="closeModal">Batal</button><button class="btn pri" data-act="saveBatch" data-id="${p.id}">Tambah batch ${p.batches.length + 1}</button>`);
    setTimeout(() => document.getElementById('nbQty')?.select(), 20);
  },
  saveBatch: d => {
    const p = S.projects.find(x => x.id === d.id);
    const qty = Math.max(1, +document.getElementById('nbQty').value || 1);
    const cols = colorsOf(JSON.parse(JSON.stringify(p))), sel = document.getElementById('nbColor'), c = cols[sel ? +sel.value : 0] || {};
    p.batches.push({id:uid(), panelNeeded:qty, panelDoneManual:0, pattern:c.pattern || '', product:c.product || '', live:!!document.getElementById('nbLive')?.checked});
    UI.collapsed[p.id] = false; closeModal(); commit(`Batch ${p.batches.length} ditambahkan, tahapannya masuk antrian`);
  },
  panelAdj: d => { const p = S.projects.find(x => x.id === d.pid), b = p.batches.find(x => x.id === d.bid); b.panelDoneManual = Math.max(0, (b.panelDoneManual || 0) + (+d.d)); commit(); },
  closeOverlay: (d, el, e) => { if (e.target === el) closeModal(); },
  closeModal: () => closeModal(),
  dateShift: d => { UI.date = addDays(UI.date, +d.n * (UI.plotView === 'week' ? 7 : 1)); render(); },
  plotView: d => { UI.plotView = d.v; lsSet('dre-plotview', d.v); render(); },
  openDay: d => { UI.date = d.d; UI.plotView = 'day'; render(); window.scrollTo(0, 0); },
  addCustomCell: d => {
    modal(`Tugas lain · ${esc(emp(d.emp)?.name)} · ${fmtDate(d.d, {weekday:'long', day:'numeric', month:'short'})}`,
      `<input type="text" id="cTxt" placeholder="mis. Bersih-bersih Lapak"><div class="taglist">${S.quickTasks.map(q => `<button class="tag" style="padding:5px 10px" data-act="quickPick" data-v="${esc(q)}">${esc(q)}</button>`).join('')}</div>`,
      `<button class="btn ghost" data-act="closeModal">Batal</button><button class="btn pri" data-act="saveCustom" data-emp="${d.emp}" data-d="${d.d}">Tambah</button>`);
    setTimeout(() => document.getElementById('cTxt')?.focus(), 20);
  },
  quickPick: d => { const i = document.getElementById('cTxt'); i.value = d.v; i.focus(); },
  saveCustom: d => { const v = document.getElementById('cTxt').value.trim(); if (!v) return toast('Isi nama tugasnya dulu'); S.plots.push({id:uid(), type:'custom', text:v, emp:d.emp, date:d.d, done:false}); closeModal(); commit('Tugas ditambahkan'); },
  dateToday: () => { UI.date = today(); render(); },
  pdateShift: d => { UI.panelDate = addDays(UI.panelDate, +d.n * (UI.panelView === 'week' ? 7 : 1)); render(); },
  shareShift: d => { UI.shareDate = addDays(UI.shareDate, +d.n); render(); },
  shareToday: () => { UI.shareDate = today(); render(); },
  authMode: d => { UI.authMode = d.v; UI.authMsg = ''; render(); },
  authLogin: async () => {
    const email = val('auEmail'), password = val('auPass');
    if (!email || !password) return authMsg('Isi email dan password dulu.');
    authMsg('Masuk…');
    const { error } = await sb.auth.signInWithPassword({email, password});
    if (error) authMsg(/invalid login/i.test(error.message) ? 'Email atau password salah.' : /not confirmed/i.test(error.message) ? 'Email belum dikonfirmasi. Cek kotak masuk email kamu.' : error.message);
  },
  authSignup: async () => {
    const name = val('auName'), email = val('auEmail'), password = val('auPass');
    if (!name || !email || !password) return authMsg('Isi nama, email, dan password.');
    if (password.length < 6) return authMsg('Password minimal 6 karakter.');
    authMsg('Mendaftarkan…');
    const { data, error } = await sb.auth.signUp({email, password, options: {data: {name}, emailRedirectTo: location.origin + location.pathname}});
    if (error) return authMsg(/registered/i.test(error.message) ? 'Email ini sudah terdaftar. Silakan masuk.' : error.message);
    if (!data.session) { UI.authMode = 'login'; authMsg('Akun dibuat. Cek email kamu dan klik link konfirmasi, lalu masuk di sini.'); }
  },
  authForgot: async () => {
    const email = val('auEmail');
    if (!email) return authMsg('Isi email kamu dulu, lalu klik "Lupa password?".');
    const { error } = await sb.auth.resetPasswordForEmail(email, {redirectTo: location.origin + location.pathname});
    authMsg(error ? error.message : 'Link untuk membuat password baru sudah dikirim ke email kamu.');
  },
  authSetPass: async () => {
    const password = val('auNew');
    if (password.length < 6) return authMsg('Password minimal 6 karakter.');
    const { error } = await sb.auth.updateUser({password});
    if (error) return authMsg(error.message);
    UI.authMode = 'login'; UI.authMsg = ''; toast('Password baru disimpan'); render();
  },
  logout: async () => { await sb.auth.signOut(); location.reload(); },
  plotDay: d => { UI.date = d.d; render(); },
  panelDay: d => { UI.panelDate = d.d; render(); },
  mQueue: () => { UI.mQueue = !UI.mQueue; render(); },
  mNeeds: () => { UI.mNeeds = !UI.mNeeds; render(); },
  mFilters: () => { UI.mFilters = !UI.mFilters; render(); },
  pickFor: d => openAssignSheet(d.emp),
  assignTo: d => { assignTask(d.key, d.emp, UI.date); openAssignSheet(d.emp); },
  pickPapan: d => openPapanSheet(d.m),
  papanTo: d => { addNeedToMachine(d.pid, d.bid, d.m, UI.panelDate, 1, d.no); openPapanSheet(d.m); },
  mMenu: () => modal('Menu', `<div class="small muted" style="margin:-4px 0 12px">${esc(ME ? (ME.name || ME.email) : '')}${ROLE ? ' · ' + ROLE_LABEL[ROLE] : ''}</div>
    <div class="mmenu">${canSee('settings') ? '<button class="btn" data-act="mGo" data-page="settings">⚙️ Pengaturan</button>' : ''}<button class="btn" data-act="logout">↪ Keluar</button></div>`),
  mGo: d => { closeModal(); ACT.page({page: d.page}); },
  pdateToday: () => { UI.panelDate = today(); render(); },
  panelView: d => { UI.panelView = d.v; try { localStorage.setItem('dre-panelview', d.v); } catch(e) {} render(); },
  openPanelDay: d => { UI.panelDate = d.d; UI.panelView = 'day'; render(); window.scrollTo(0, 0); },
  qcat: d => { UI.qCat = d.v; render(); },
  unplot: d => { const x = S.plots.find(y => y.id === d.id); if (x && x.type === 'task') delete S.doneManual[x.key]; S.plots = S.plots.filter(y => y.id !== d.id); commit(x && x.type === 'task' ? 'Kembali ke antrian' : 'Tugas dihapus'); },
  carry: () => { const d = UI.date; let n = 0; S.plots.forEach(x => { if (x.date < d && !x.done && x.date >= addDays(d, -30)) { x.date = d; n++; } }); commit(`${n} tugas dipindahkan ke ${fmtDate(d)}`); },
  print: () => window.print(),
  pickNeed: d => {
    const p = S.projects.find(x => x.id === d.pid);
    const b = p.batches.find(x => x.id === d.bid) || {};
    modal(d.no ? `Papan #${d.no} · ${esc(b.pattern || p.pattern || '')}` : 'Cetak panel di mesin…', `<div class="small muted">${esc(projName(p))}</div><div style="margin-top:12px;display:flex;align-items:center;gap:8px"><label class="f" style="margin:0">Tanggal</label><input type="date" id="pnDate" value="${UI.panelDate}" style="width:170px"></div><div class="emp-pick">${S.machines.map(m => `<button data-act="needTo" data-m="${m.id}" data-pid="${d.pid}" data-bid="${d.bid}" data-qty="${d.qty || ''}" data-no="${d.no || ''}">${esc(m.name)}</button>`).join('')}</div>`);
  },
  needTo: d => { const date = document.getElementById('pnDate')?.value || UI.panelDate; closeModal(); addNeedToMachine(d.pid, d.bid, d.m, date, +d.qty || 0, d.no); },
  delPanel: d => { S.panels = S.panels.filter(x => x.id !== d.id); commit(); },
  addStock: d => {
    modal('Panel stok / manual', `<div class="fgrid"><div class="full"><label class="f">Pattern / warna</label><input type="text" id="spPat" placeholder="mis. Biru Muda"></div>
      <div><label class="f">Ketebalan</label><select id="spSize">${sizeOptions('10mm')}</select></div>
      <div><label class="f">Jumlah panel</label><input type="number" id="spQty" value="1" min="1"></div></div>`,
      `<button class="btn ghost" data-act="closeModal">Batal</button><button class="btn pri" data-act="saveStock" data-m="${d.m}" data-d="${d.d || ''}">Tambah</button>`);
    setTimeout(() => document.getElementById('spPat')?.focus(), 20);
  },
  saveStock: d => { const pat = document.getElementById('spPat').value.trim(); if (!pat) return toast('Isi pattern dulu'); S.panels.push({id:uid(), date:d.d || UI.panelDate, machine:d.m, pattern:pat, size:document.getElementById('spSize').value, qty:+document.getElementById('spQty').value || 1, pid:'', batchId:'', done:false}); closeModal(); commit('Panel ditambahkan'); },
  // project form
  fSet: d => { F[d.k] = d.v; if (d.k === 'cat') F.steps = [...S.steps[d.v]]; renderProjectForm(); },
  fSplit: () => { rebuildBatches('all'); renderProjectForm(); },
  fAddColor: () => { F.colors.push({id:uid(), pattern:'', product:'', papan:0, nb:1}); rebuildBatches(null); renderProjectForm(); setTimeout(() => document.querySelectorAll('[data-cf="pattern"]')[F.colors.length - 1]?.focus(), 20); },
  fDelColor: d => { if (F.colors.length < 2) return; F.colors.splice(+d.ci, 1); rebuildBatches(null); renderProjectForm(); },
  saveProj: () => {
    if (!F.name.trim()) return toast('Nama produk wajib diisi');
    if (F.owner === 'client' && !F.client.trim()) return toast('Nama client wajib diisi');
    if (!F.steps.length) return toast('Pilih minimal 1 tahapan');
    if (F.colors.length > 1 && F.colors.some(c => !c.pattern.trim())) return toast('Isi nama warna di setiap baris warna papan');
    const isNew = F._new; delete F._new;
    if (F.owner === 'internal') F.client = '';
    rebuildBatches(null);
    F.pattern = [...new Set(F.colors.map(c => c.pattern.trim()).filter(Boolean))].join(', ');
    F.batches.forEach(b => { b.panelNeeded = needOf(F, b); b.pattern = (b.pattern || '').trim(); b.product = (b.product || '').trim(); delete b.qty; delete b.cid; });
    delete F.colors; delete F.panelTotal;
    const i = S.projects.findIndex(x => x.id === F.id);
    if (i >= 0) {
      // clean up plots of removed batches/steps
      const valid = new Set(); F.batches.forEach(b => F.steps.forEach(s => valid.add(F.id + '|' + b.id + '|' + s)));
      S.plots = S.plots.filter(x => !(x.type === 'task' && x.key.startsWith(F.id + '|') && !valid.has(x.key)));
      const bids = new Set(F.batches.map(b => b.id)); S.panels = S.panels.filter(x => x.pid !== F.id || bids.has(x.batchId));
      S.projects[i] = F;
    } else S.projects.unshift(F);
    closeModal(); commit(isNew ? 'Proyek dibuat — tahapannya sudah masuk antrian plotting' : 'Proyek disimpan');
  },
  // settings
  addEmp: () => { const el = document.getElementById('newEmp'), n = el.value.trim(); if (!n) return; S.employees.push({id:uid(), name:n, color:EMP_COLORS[S.employees.length % EMP_COLORS.length], active:true}); commit('Karyawan ditambahkan'); },
  empToggle: d => { const e = emp(d.id); e.active = !e.active; commit(); },
  addMachine: () => { const n = document.getElementById('newM').value.trim(); if (!n) return; S.machines.push({id:uid(), name:n}); commit(); },
  delMachine: d => {
    const go = () => { S.machines = S.machines.filter(m => m.id !== d.id); S.panels = S.panels.filter(x => x.machine !== d.id); commit(); };
    if (S.panels.some(x => x.machine === d.id)) ask('Mesin ini punya riwayat panel. Riwayatnya ikut terhapus.', 'Hapus mesin', go); else go();
  },
  delQuick: d => { S.quickTasks.splice(+d.i, 1); commit(); },
  stepMove: d => { const a = S.steps[d.cat], i = +d.i, j = i + (+d.d); if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; commit(); },
  stepDel: d => ask(`Hapus tahapan "${S.steps[d.cat][+d.i]}" dari daftar default? Proyek lama tidak berubah.`, 'Hapus tahapan', () => { S.steps[d.cat].splice(+d.i, 1); commit(); }),
  exportJson: () => download(`DRE-backup-${today()}.json`, JSON.stringify(S, null, 1), 'application/json'),
  exportCsv: () => {
    const rows = [['Tanggal','Karyawan','Tugas','Proyek','Batch','Papan','Selesai','Kehadiran']];
    [...S.plots].sort((a, b) => a.date.localeCompare(b.date)).forEach(x => {
      const t = x.type === 'task' ? taskByKey(x.key) : null;
      rows.push([x.date, emp(x.emp)?.name || '', t ? t.step : x.text, t ? projName(t.p) : '', t ? t.bi + 1 : '', t ? needOf(t.p, t.b) : '', x.done ? 'Ya' : 'Belum', (S.attendance[x.date] || {})[x.emp] || 'Masuk']);
    });
    download(`DRE-plotting-${today()}.csv`, '﻿' + rows.map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n'), 'text/csv');
  },
  loadSample: () => ask('Ganti semua data tim dengan data contoh dari Excel?', 'Ganti data', () => { S = seed(); commit('Data contoh dimuat'); }),
  wipe: () => ask('Hapus SEMUA proyek, plotting, dan panel untuk seluruh tim? Karyawan & pengaturan tetap. Download backup dulu kalau ragu.', 'Kosongkan data', () => { Object.assign(S, {projects:[], plots:[], panels:[], doneManual:{}, attendance:{}}); commit('Data dikosongkan'); }),
};

// in-page confirmation (the claude.ai viewer blocks window.confirm)
function ask(msg, yesLabel, onYes){
  modal('Yakin?', `<p style="margin:4px 0 6px">${esc(msg)}</p>`, `<button class="btn ghost" data-act="closeModal">Batal</button><button class="btn pri" id="askYes" style="background:var(--red);border-color:var(--red)">${esc(yesLabel)}</button>`);
  document.getElementById('askYes').onclick = () => { closeModal(); onYes(); };
}

// free board numbers of a batch: 1..need minus the numbers already on a machine schedule
function freePapanNos(p, b, rem){
  const used = new Set(S.panels.filter(x => x.batchId === b.id && x.no).map(x => +x.no)), out = [];
  for (let i = 1; out.length < rem && i <= needOf(p, b) + rem; i++) if (!used.has(i)) out.push(i);
  return out;
}
function addNeedToMachine(pid, bid, mid, date, qty, no){
  const p = S.projects.find(x => x.id === pid), b = p.batches.find(x => x.id === bid);
  const rem = Math.max(1, (needOf(p, b)) - panelDone(b) - panelPlanned(b)), q = qty ? Math.min(qty, rem) : rem;
  if (no && S.panels.some(x => x.batchId === bid && +x.no === +no)) no = freePapanNos(p, b, 1)[0];
  const pattern = b.pattern || p.pattern || '?';
  S.panels.push(Object.assign({id:uid(), date:date || UI.panelDate, machine:mid, pattern, size:p.size || '', qty:q, pid, batchId:bid, done:false}, no ? {no:+no} : {}));
  commit(`${no ? 'Papan #' + no + ' ' + pattern : q + ' papan'} → ${S.machines.find(m => m.id === mid)?.name} · ${fmtDate(date || UI.panelDate)}`);
}
function download(name, text, type){
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }

const CH = {
  plotDone: el => {
    const x = S.plots.find(y => y.id === el.dataset.id); x.done = el.checked;
    // mirror onto the project so the step stays "done" after old plots leave the loaded window
    if (x.type === 'task') { if (x.done) S.doneManual[x.key] = true; else delete S.doneManual[x.key]; }
    commit(el.checked ? 'Selesai ✓' : ''); },
  pNum: el => { const p = S.projects.find(x => x.id === el.dataset.pid); p[el.dataset.k] = Math.max(0, Math.round(+el.value || 0)); commit(); },
  att: el => { (S.attendance[UI.date] = S.attendance[UI.date] || {})[el.dataset.emp] = el.value; commit(); },
  date: el => { if (el.value) { UI.date = el.value; render(); } },
  roleSet: el => { sb.from('profiles').update({role: el.value}).eq('id', el.dataset.uid).then(({error}) => toast(error ? 'Gagal mengubah akses: ' + error.message : 'Akses diperbarui')); },
  shareDone: el => { UI.shareDone = el.checked; render(); },
  pdate: el => { if (el.value) { UI.panelDate = el.value; render(); } },
  panelDone: el => { S.panels.find(y => y.id === el.dataset.id).done = el.checked; commit(el.checked ? 'Panel jadi ✓' : ''); },
  panelQty: el => { S.panels.find(y => y.id === el.dataset.id).qty = Math.max(1, +el.value || 1); commit(); },
  fColorSplit: el => { rebuildBatches(new Set([F.colors[+el.dataset.ci].id])); renderProjectForm(); },
  fBatchPanel: () => { rebuildBatches(null); renderProjectForm(); },
  fStep: el => { const s = el.dataset.s; F.steps = el.checked ? [...F.steps, s] : F.steps.filter(x => x !== s); renderProjectForm(); },
  empName: el => { emp(el.dataset.id).name = el.value.trim() || 'Tanpa nama'; commit(); },
  empColor: el => { emp(el.dataset.id).color = el.value; commit(); },
  mName: el => { S.machines.find(m => m.id === el.dataset.id).name = el.value; commit(); },
  importJson: el => {
    const f = el.files[0]; if (!f) return;
    f.text().then(txt => { const d = JSON.parse(txt); if (!d.version || !d.projects) throw new Error('bukan file backup DRE'); ask('Restore akan mengganti semua data tim dengan isi file ini. Lanjut?', 'Restore', () => { S = d; commit('Data berhasil di-restore'); }); })
      .catch(e => toast('Gagal restore: ' + e.message));
  },
};


/* ============ EVENTS ============ */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.tagName === 'INPUT' || el.tagName === 'SELECT') return;
  const fn = ACT[el.dataset.act]; if (fn) fn(el.dataset, el, e);
});
document.addEventListener('change', e => { const el = e.target; if (el.dataset && el.dataset.ch && CH[el.dataset.ch]) CH[el.dataset.ch](el, e); });
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.f !== undefined && F) F[el.dataset.f] = el.type === 'number' ? +el.value : el.value;
  if (el.dataset.bf !== undefined && F) F.batches[+el.dataset.i][el.dataset.bf] = el.type === 'number' ? +el.value : el.value;
  if (el.dataset.cf !== undefined && F) F.colors[+el.dataset.ci][el.dataset.cf] = el.type === 'number' ? +el.value : el.value;
  if (el.dataset.in) { UI[el.dataset.in] = el.value; render(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if (e.key !== 'Enter') return;
  const el = e.target, v = (el.value || '').trim();
  if (el.dataset.addcustom && v) { S.plots.push({id:uid(), type:'custom', text:v, emp:el.dataset.addcustom, date:UI.date, done:false}); if (!S.quickTasks.includes(v) && !/ - /.test(v)) S.quickTasks.push(v); commit('Tugas ditambahkan'); setTimeout(() => document.querySelector(`[data-addcustom="${el.dataset.addcustom}"]`)?.focus(), 0); }
  if (el.dataset.addstep && v) { S.steps[el.dataset.addstep].push(v); commit('Tahapan ditambahkan'); }
  if (el.dataset.addquick && v) { S.quickTasks.push(v); commit(); }
  if (['auName', 'auEmail', 'auPass', 'auNew'].includes(el.id)) document.querySelector('.auth-card .btn.pri')?.click();
  if (el.id === 'cTxt') document.querySelector('[data-act="saveCustom"]')?.click();
  if (el.id === 'newEmp') ACT.addEmp(); if (el.id === 'newM') ACT.addMachine();
});

// drag & drop
let DRAG = null;
document.addEventListener('dragstart', e => {
  const el = e.target.closest && e.target.closest('[data-drag]'); if (!el) return;
  DRAG = {...el.dataset}; el.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', el.dataset.drag);
});
document.addEventListener('dragend', e => { document.querySelectorAll('.dragging,.drop-on').forEach(x => x.classList.remove('dragging', 'drop-on')); });
const dropOK = (zone) => DRAG && ({emp:['task','plot'], queue:['plot'], machine:['need','panel'], pqueue:['panel']}[zone.dataset.drop] || []).includes(DRAG.drag);
document.addEventListener('dragover', e => {
  const z = e.target.closest && e.target.closest('[data-drop]');
  document.querySelectorAll('.drop-on').forEach(x => x !== z && x.classList.remove('drop-on'));
  if (z && dropOK(z)) { e.preventDefault(); z.classList.add('drop-on'); }
});
document.addEventListener('drop', e => {
  const z = e.target.closest && e.target.closest('[data-drop]'); if (!z || !dropOK(z)) return;
  e.preventDefault(); const D = DRAG; DRAG = null;
  const zt = z.dataset.drop;
  if (zt === 'emp' && D.drag === 'task') assignTask(D.key, z.dataset.emp, z.dataset.date || UI.date);
  else if (zt === 'emp' && D.drag === 'plot') {
    const x = S.plots.find(y => y.id === D.id), date = z.dataset.date || x.date;
    if (x.emp !== z.dataset.emp || x.date !== date) { x.emp = z.dataset.emp; x.date = date; commit('Dipindah ke ' + emp(x.emp).name + ' · ' + fmtDate(date)); } else render();
  }
  else if (zt === 'queue') ACT.unplot({id: D.id});
  else if (zt === 'machine' && D.drag === 'need') addNeedToMachine(D.pid, D.bid, z.dataset.m, z.dataset.date, +D.qty || 0, D.no);
  else if (zt === 'machine' && D.drag === 'panel') { const x = S.panels.find(y => y.id === D.id); x.machine = z.dataset.m; if (z.dataset.date) x.date = z.dataset.date; commit(); }
  else if (zt === 'pqueue') ACT.delPanel({id: D.id});
});

render();
setSync();
startAuth();
</script>
